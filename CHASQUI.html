<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ACTUALIZACIÓN DE INFORMACIÓN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Actualización de Información</h2>
    <form action="https://formspree.io/f/mwplzarp" method="POST">
      <label for="degree">Grado:</label>
      <input type="text" id="degree" name="Grado" required>
    
      <label for="name">Nombre completo:</label>
      <input type="text" id="name" name="Nombre completo" required>
    
      <label for="DNI">DNI:</label>
      <input type="text" id="DNI" name="DNI" required>
    
      <label for="CIP">CIP:</label>
      <input type="text" id="CIP" name="CIP" required>
    
      <label for="email">Correo Institucional:</label>
      <input type="email" id="email" name="Correo Institucional" required>
    
      <label for="address">Dirección Actual:</label>
      <input type="text" id="address" name="Dirección Actual" required>
    
      <label for="phone">Número de teléfono:</label>
      <input type="tel" id="phone" name="Teléfono">
    
      <label for="Dependence">Dependencia Actual:</label>
      <select id="Dependence" name="Dependencia">
        <option value="">Seleccioná una opción</option>
        <option>DIE</option>
        <option>BIE N° 511</option>
        <option>CIA CIBERINTG</option>
        <option>Otros</option>
      </select>
    
      <button type="submit">Registrarse</button>
    </form>
